# Evolución Bernoulli con mutación determinista
populations:
  dominant:
    n: 60
    fitness: 2.0
  weak:
    n: 40
    fitness: 1.0

steps: 200

engine:
  type: bernoulli
  seed: 42

mutation:
  type: deterministic
  every_n_steps: 10
  victim_group: weak
  new_group_name: mutated
  new_fitness: 25.0

output: results_deterministic_mutation.xlsx
